# ==============================================================
# HIJO RESOURCE CORPORATION - DOCKER INFRASTRUCTURE STACK
# ==============================================================

version: '3.8'

networks:
  hijo_network:
    name: hijo_network

services:
  # --- COUCHDB ---
  couchdb.agri:
    image: couchdb:3.3.2
    container_name: couchdb.agri
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports: ["5984:5984"]
    networks: [hijo_network]

  couchdb.logistics:
    image: couchdb:3.3.2
    container_name: couchdb.logistics
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports: ["5985:5984"]
    networks: [hijo_network]
  
  couchdb.port:
    image: couchdb:3.3.2
    container_name: couchdb.port
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports: ["5986:5984"]
    networks: [hijo_network]

  #---  Peer Nodes  ---
  peer0.agri.hijo.com:
    image: hyperledger/fabric-peer:2.5.9
    container_name: peer0.agri.hijo.com
    environment:
      - CORE_VM_ENDPOINT=unix:///var/run/docker.sock
      - DOCKER_API_VERSION=1.40
      - DOCKER_BUILDKIT=0
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=hijo_network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.agri.hijo.com
      - CORE_PEER_ADDRESS=peer0.agri.hijo.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.agri.hijo.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.agri.hijo.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.agri.hijo.com:7051
      - CORE_PEER_LOCALMSPID=HijoAgriMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.agri:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../crypto-config/peerOrganizations/agri.hijo.com/peers/peer0.agri.hijo.com/msp:/etc/hyperledger/fabric/msp
      - ../crypto-config/peerOrganizations/agri.hijo.com/peers/peer0.agri.hijo.com/tls:/etc/hyperledger/fabric/tls
    ports: ["7051:7051"]
    depends_on: [couchdb.agri]
    networks: [hijo_network]

  peer0.logistics.hijo.com:
    image: hyperledger/fabric-peer:2.5.9
    container_name: peer0.logistics.hijo.com
    environment:
      - CORE_VM_ENDPOINT=unix:///var/run/docker.sock
      - DOCKER_API_VERSION=1.40
      - DOCKER_BUILDKIT=0
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=hijo_network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.logistics.hijo.com
      - CORE_PEER_ADDRESS=peer0.logistics.hijo.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.logistics.hijo.com:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_LOCALMSPID=HijoLogisticsMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.logistics:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../crypto-config/peerOrganizations/logistics.hijo.com/peers/peer0.logistics.hijo.com/msp:/etc/hyperledger/fabric/msp
      - ../crypto-config/peerOrganizations/logistics.hijo.com/peers/peer0.logistics.hijo.com/tls:/etc/hyperledger/fabric/tls
    ports: ["8051:8051"]
    depends_on: [couchdb.logistics]
    networks: [hijo_network]

  peer0.port.hijo.com:
    image: hyperledger/fabric-peer:2.5.9
    container_name: peer0.port.hijo.com
    environment:
      - CORE_VM_ENDPOINT=unix:///var/run/docker.sock
      - DOCKER_API_VERSION=1.40
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=hijo_network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.port.hijo.com
      - CORE_PEER_ADDRESS=peer0.port.hijo.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.port.hijo.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_LOCALMSPID=HijoPortMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.port:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../crypto-config/peerOrganizations/port.hijo.com/peers/peer0.port.hijo.com/msp:/etc/hyperledger/fabric/msp
      - ../crypto-config/peerOrganizations/port.hijo.com/peers/peer0.port.hijo.com/tls:/etc/hyperledger/fabric/tls
    ports: ["9051:9051"]
    depends_on: [couchdb.port]
    networks: [hijo_network]

#--- 3 NODE RAFT CONSESUS FOR ORDERER CLUSTER ---
  orderer1.hijo.com:
    image: hyperledger/fabric-orderer:2.5.9
    container_name: orderer1.hijo.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      # - ORDERER_GENERAL_GENESISMETHOD=file
      # - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_GENERAL_LOCALMSPID=HijoOrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_CLIENTAUTHREQUIRED=true
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    volumes:
    - ../channel-artifacts/orderer.genesis.block:/var/hyperledger/orderer/orderer.genesis.block
    - ../crypto-config/ordererOrganizations/hijo.com/orderers/orderer1.hijo.com/msp:/var/hyperledger/orderer/msp
    - ../crypto-config/ordererOrganizations/hijo.com/orderers/orderer1.hijo.com/tls:/var/hyperledger/orderer/tls
    ports: ["7050:7050", "7053:7053"]
    networks: [hijo_network]

  orderer2.hijo.com:
    image: hyperledger/fabric-orderer:2.5.9
    container_name: orderer2.hijo.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=8050
      # - ORDERER_GENERAL_GENESISMETHOD=file
      # - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_GENERAL_LOCALMSPID=HijoOrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:8053
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_CLIENTAUTHREQUIRED=true
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    volumes:
    - ../channel-artifacts/orderer.genesis.block:/var/hyperledger/orderer/orderer.genesis.block
    - ../crypto-config/ordererOrganizations/hijo.com/orderers/orderer2.hijo.com/msp:/var/hyperledger/orderer/msp
    - ../crypto-config/ordererOrganizations/hijo.com/orderers/orderer2.hijo.com/tls:/var/hyperledger/orderer/tls
    ports: ["8050:8050", "8053:8053"]
    networks: [hijo_network]

  orderer3.hijo.com:
    image: hyperledger/fabric-orderer:2.5.9
    container_name: orderer3.hijo.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=9050
      # - ORDERER_GENERAL_GENESISMETHOD=file
      # - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_GENERAL_LOCALMSPID=HijoOrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:9053
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_CLIENTAUTHREQUIRED=true
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    volumes:
    - ../channel-artifacts/orderer.genesis.block:/var/hyperledger/orderer/orderer.genesis.block
    - ../crypto-config/ordererOrganizations/hijo.com/orderers/orderer3.hijo.com/msp:/var/hyperledger/orderer/msp
    - ../crypto-config/ordererOrganizations/hijo.com/orderers/orderer3.hijo.com/tls:/var/hyperledger/orderer/tls
    ports: ["9050:9050", "9053:9053"]
    networks: [hijo_network]

  chaincode.banana.tracking:
    build:
      context: ../chaincode/banana_tracking
      dockerfile: Dockerfile
    container_name: chaincode.banana.tracking
    environment:
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:9999
      - CHAINCODE_ID=${CHAINCODE_ID}
    ports:
      - "9999:9999"
    networks:
      - hijo_network